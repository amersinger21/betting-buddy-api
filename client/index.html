<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>The Betting Buddy - Home</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/light.css"
		/>
		<link rel="stylesheet" href="/global.css" />
		<script
			type="module"
			src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace-autoloader.js"
		></script>
	</head>
	<body>
		<nav>
			<h1 id="logo">The Betting Buddy</h1>
			<sl-icon-button
				name="list"
				style="font-size: 2.5rem"
				label="menu"
				id="menu-open"
			>
			</sl-icon-button>
		</nav>

		<main>
			<div id="btn-container" class="card-basic">
				<h2>Select a sport to search</h2>
				<a href="/pages/football/search.html">
					<button class="btn-sport">
						<img
							class="icon"
							src="/images/american-football.png"
							alt="football icon"
						/>
						<p>Football</p>
					</button>
				</a>
				<a href="/error.html">
					<button class="btn-sport">
						<img
							class="icon"
							src="/images/basketball-ball.png"
							alt="football icon"
						/>
						<p>Basketball</p>
					</button>
				</a>
				<a href="/error.html">
					<button class="btn-sport">
						<img
							class="icon"
							src="/images/baseball.png"
							alt="football icon"
						/>
						<p>Baseball</p>
					</button>
				</a>
				<a href="/error.html">
					<button class="btn-sport">
						<img
							class="icon"
							src="/images/hockey.png"
							alt="football icon"
						/>
						<p>Hockey</p>
					</button>
				</a>
				<a href="/">
					<button class="btn-sport disabled">
						<img
							class="icon"
							src="/images/soccer.png"
							alt="football icon"
						/>
						<p>Soccer</p>
					</button>
				</a>
			</div>
		</main>
		<sl-drawer label="Drawer" placement="end" class="drawer-placement-end">
			This drawer slides in from the start.
			<sl-button slot="footer" variant="primary">Close</sl-button>
		</sl-drawer>
	</body>
</html>

<script>
	const drawer = document.querySelector(".drawer-placement-end");
	const openButton = document.querySelector("#menu-open");
	const closeButton = drawer.querySelector('sl-button[variant="primary"]');

	openButton.addEventListener("click", () => drawer.show());
	closeButton.addEventListener("click", () => drawer.hide());
</script>
