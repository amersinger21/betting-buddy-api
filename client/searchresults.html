<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./results.css" />
  </head>
  <body>
    <h1>Betting Buddy Results Page</h1>
    <div id="summary">
      <div id="first-row">
        <div id="player-image" class="first-level"><h2>TO BE ADDED</h2></div>
        <div id="player-info" class="first-level">
          <p id="name"><strong>Name: </strong></p>
          <p id="pos"><strong>Pos: </strong></p>
          <p id="team"><strong>Team: </strong></p>
        </div>
        <div id="bet-summary-occur" class="first-level">
          <div id="total-sum" class="bet-summary"><span class="bet-summary-span"><h3>Bet Summary</h3></span></div>
          <div id="loc-sum" class="bet-summary"><span class="bet-summary-span"><h3>Location Summary</h3></span></div>
          <div id="misc-sum" class="bet-summary"><span class="bet-summary-span"><h3>Misc Summary</h3></span></div>
        </div>
      </div>
      <div id="second-row">
        <div id="player-sum-container" class="second">
          <span class="second-span"><h3>Player Summary</h3></span>
          <div id="player-sum">
            <div id="sum-avg" class="player-sum-class"><span class="white-span"><strong>Total</strong></span></div>
            <div id="sum-home" class="player-sum-class"><span class="white-span"><strong>Home</strong></span></div>
            <div id="sum-away" class="player-sum-class"><span class="white-span"><strong>Away</strong></span></div>
          </div>
        </div>
        <div id="team-sum" class="second"><span class="second-span"><h3>Team Summary</h3></span></div>
        <div id="opp-sum" class="second"><span class="second-span"><h3>Opponent Summary</h3></span></div>
      </div>
      <div id="third-row">
        <h3>Last 5 Games</h3>
        <table id="summary-logs" class="paddingBetweenCols">
        </table>
      </div>
    </div>

    <div id="button-container">
      <button type="button" class="next-buttons" id=""><strong>Game Logs</strong></button>
      <button type="button" class="next-buttons" id=""><strong>Player Bet Data</strong></button>
      <button type="button" class="next-buttons" id=""><strong>Team Data</strong></button>
      <button type="button" class="next-buttons" id=""><strong>Opponent Data</strong></button>
    </div>
  </body>
</html>

<script>
  const nflIdArray = {'ARI': 1, 'ATL': 2, 'BAL': 3, 'BUF': 4, 'CAR': 5, 'CHI': 6, 'CIN': 7, 'CLE': 8, 'DAL': 9, 'DEN': 10,
                 'DET': 11, 'GB': 12, 'HOU': 13, 'IND': 14, 'JAX': 15, 'KC': 16, 'LAC': 17, 'LAR': 18, 'LV': 19,
                 'MIA': 20, 'MIN': 21, 'NE': 22, 'NO': 23, 'NYG': 24, 'NYJ': 25, 'PHI': 26, 'PIT': 27, 'SEA': 28,
                 'SF': 29, 'TB': 30, 'TEN': 31, 'WAS': 32}
  const nflTeamArray = {1: 'ARI', 2: 'ATL', 3: 'BAL', 4: 'BUF', 5: 'CAR', 6: 'CHI', 7: 'CIN', 8: 'CLE', 9: 'DAL', 10: 'DEN', 
    11: 'DET', 12: 'GB', 13: 'HOU', 14: 'IND', 15: 'JAX', 16: 'KC', 17: 'LAC', 18: 'LAR', 19: 'LV', 20: 'MIA', 21: 'MIN', 
    22: 'NE', 23: 'NO', 24: 'NYG', 25: 'NYJ', 26: 'PHI', 27: 'PIT', 28: 'SEA', 29: 'SF', 30: 'TB', 31: 'TEN', 32: 'WAS'}
  const yearArray = {'current': 2025, 'prior': 2024, 'third': 2023, 'fourth': 2022, 'fifth': 2021}


  const passArray = ['pass_att', 'pass_yards', 'pass_td', 'pass_comp', 'pass_longest']
  const rushArray = ['rush_att', 'rush_yards', 'rush_td', 'rush_longest']
  const recArray = ['rec', 'targets', 'rec_yards', 'rec_td', 'rec_longest']
  
  // Initialize object variables
  statLimitDict = {'pass_att': 'Pass Att', 'pass_yards': 'Pass Att', 'pass_td': 'Pass Att', 'pass_comp': 'Pass Att',
              'pass_longest': 'Pass Att', 'rush_att': 'Rush Att','rush_yards': 'Rush Att', 'rush_td': 'Rush Att', 
              'rush_longest': 'Rush Att', 'rec': 'Targets', 'targets': 'Targets', 'rec_yards': 'Targets', 'rec_td': 'Targets', 
              'rec_longest': 'Targets'}
  statDict = {'pass_att': 'Pass Att', 'pass_yards': 'Pass Yard', 'pass_td': 'Pass TD', 'pass_comp': 'Pass Completions', 
              'pass_longest': 'Longest Pass', 'rush_att': 'Rush Att','rush_yards': 'Rush Yard', 'rush_td': 'Rush TD', 
              'rush_longest': 'Longest Rush', 'rec': 'Receptions', 'targets': 'Targets', 'rec_yards': 'Rec Yard', 'rec_td': 'Rec TD', 
              'rec_longest': 'Longest Catch'}
  
  let params = new URLSearchParams(document.location.search);
  // Initialize the query variables
  const id = params.get("id");
  const stat = params.get("stat");
  const team = params.get('team')
  const operator = params.get("operator");
  const amount = params.get("amount");
  const limitStat = statLimitDict[stat]
  let data;

  async function summarySection(team_id) {

    //=========================================PLAYER SECTION===============================================// 
    const playerInfoResponse = await fetch(`http://129.80.84.210/api/nfl/summary/player_info?id=${id}`);
    const playerInfoData = await playerInfoResponse.json();
 
    const startQbRequest = await fetch(`http://129.80.84.210/api/nfl/team/starting_qb?team_id=${team_id}`);
    const startQbData = await startQbRequest.json();
    const startingQB = startQbData['starting_qb']

    const nextGameRequest = await fetch(`http://129.80.84.210/api/nfl/player/next_game?team_id=${team_id}`);
    const nextGameData = await nextGameRequest.json();
    const location = nextGameData['next_game_loc']

    const betSummaryRequest = await fetch(
      `http://129.80.84.210/api/nfl/summary/bet_occurrence_summary?id=${id}&stat=${stat}&operator=${operator}&value=${amount}&opp_id=4&loc=${location}&qb=${startingQB}`);
    const betOccurrenceData = await betSummaryRequest.json();

    const playerAvgRequest = await fetch(
      `http://129.80.84.210/api/nfl/summary/player_summary?id=${id}&stat=${stat}&opp_id=4`);
    const playerAvgData = await playerAvgRequest.json();

    //=========================================TEAM SECTION===============================================// 
    const teamSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/team_summary?team_id=${nflIdArray[team]}&stat=${stat}`);
    const teamSummaryData = await teamSummaryRequest.json();

    const teamRankSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/team_rank_summary?team_id=${nflIdArray[team]}&stat=${stat}`);
    const teamRankSummaryData = await teamRankSummaryRequest.json();

    const oppSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/opponent_summary?opp_id=4&stat=${stat}`);
    const oppSummaryData = await oppSummaryRequest.json();

    const oppRankSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/opponent_rank_summary?opp_id=4&stat=${stat}`);
    const oppRankSummaryData = await oppRankSummaryRequest.json();

    const logSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/game_logs_summary?id=${id}&stat=${stat}`);
    const logSummaryData = await logSummaryRequest.json();

    // Initialize function variables
    let loopCols;
    let rankCols;
    let avgCols;
    let teamStatConv;
    let sumLogHeader;
    let statType;
    if (rushArray.includes(stat)) {
        statType = 'rushing'
      }
    else if (recArray.includes(stat)) {
        statType = 'receiving'
      }
    else {
        statType = 'passing'
    }

    statObj = {
      'rushing': {'loopCols':['rush_att', 'rush_yards', 'rush_td', 'rush_yards_per_att', 'rush_yards_per_game'],
                  'rankCols': ['rush_att_rank', 'rush_yards_rank', 'rush_td_rank', 'yards_per_att_rank', 'yards_per_game_rank'],
                  'avgCols': ['rush_att', 'rush_yards', 'rush_td', 'rush_longest'],
                  'teamStatObj': {'rush_att': 'Rush Att', 'rush_yards': 'Rush Yards', 'rush_td': 'Rush TD', 'yards_per_att': 'Yards Per Att', 'yards_per_game': 'Yards per Game'},
                  'avgColObj': {'rush_att': 'Rush Att', 'rush_yards': 'Rush Yds', 'rush_td': 'Rec TD', 'rush_longest': 'Longest Rec'},
                  'sumLogHeader': ['Game', 'Year', 'Week', 'Pos', 'Team', 'Opponent', 'Rush Att', 'Rush Yards', 'Rush TD','Longest Rush', 'Fumbles'],
                  'statDataAtt': ['game_id', 'year', 'week', 'pos', 'team_id', 'opp_id', 'rush_att', 'rush_yards', 'rush_td', 'rush_longest', 'fumbles']
      },
      'passing': {'loopCols':['pass_att', 'pass_comp', 'pass_yards', 'pass_td', 'pass_yards_per_att', 'pass_yards_per_game'],
                  'rankCols': ['pass_att_rank', 'pass_comp_rank', 'pass_yards_rank', 'pass_td_rank', 'yards_per_att_rank', 'pass_yards_per_game_rank'],
                  'avgCols': ['pass_att', 'pass_comp', 'pass_yards', 'pass_td', 'pass_longest'],
                  'teamStatObj': {'pass_att': 'Pass Att', 'pass_comp': 'Pass Comp', 'pass_yards': 'Pass Yards', 'pass_td': 'Pass TD', 'pass_yards_per_att': 'Yards Per Att', 'pass_yards_per_game': 'Yards per Game'},
                  'avgColObj': {'pass_att': 'Pass Att', 'pass_comp': 'Completions', 'pass_yards': 'Pass Yds', 'pass_td': 'Pass TD', 'pass_longest': 'Longest Pass'},
                  'sumLogHeader': ['Game', 'Year', 'Week', 'Pos', 'Team', 'Opponent', 'Pass Att', 'Pass Comp', 'Pass Yds', 'Pass TD', 'Longest Pass'],
                  'statDataAtt': ['game_id', 'year', 'week', 'pos', 'team_id', 'opp_id', 'pass_att',  'pass_comp', 'pass_yards', 'pass_td', 'pass_longest']},
      'receiving': {'loopCols':['pass_att', 'pass_comp', 'pass_yards', 'pass_td', 'pass_yards_per_att', 'pass_yards_per_game'],
                  'rankCols': ['pass_att_rank', 'pass_comp_rank', 'pass_yards_rank', 'pass_td_rank', 'yards_per_att_rank', 'pass_yards_per_game_rank'],
                  'avgCols': ['rec', 'targets', 'rec_yards', 'rec_td', 'rec_longest'],
                  'teamStatObj': {'pass_att': 'Targets', 'pass_comp': 'Rec', 'pass_yards': 'Rec Yards', 'pass_td': 'Rec TD', 'pass_yards_per_att': 'Yards Per Rec', 'pass_yards_per_game': 'Rec Yds per Game'},
                  'avgColObj': {'rec': 'Rec', 'targets': 'Tgts', 'rec_yards': 'Rec Yds', 'rec_td': 'Rec TD', 'rec_longest': 'Longest Rec'},
                  'sumLogHeader': ['Game', 'Year', 'Week', 'Pos', 'Team', 'Opponent', 'Rec', 'Tgt', 'Rec Yds', 'Rec TD', 'Longest Rec'],
                  'statDataAtt': ['game_id', 'year', 'week', 'pos', 'team_id', 'opp_id', 'rec', 'targets', 'rec_yards', 'rec_td', 'rec_longest']}
    }

     //=========================================PLAYER SECTION===============================================// 
    // Capitalize location variable
    const firstLetter = location.charAt(0)
    const firstLetterCap = firstLetter.toUpperCase()
    const remainingLetters = location.slice(1)
    const capitalizedWord = firstLetterCap + remainingLetters

    let operatorFirstLetter = operator.charAt(0)
    const operatorCap = operatorFirstLetter.toUpperCase()
    const operatorRem = operator.slice(1)
    const operatorText = operatorCap + operatorRem

    let statFirstLetter = stat.charAt(0)
    const statCap = statFirstLetter.toUpperCase()
    const statRem = stat.slice(1)
    const statText = statCap + statRem

    // locate the elements of the summary section by ID
    let summaryTag = document.getElementById('summary')
    let firstRow = document.getElementById('first-row')
    let playerImageSection = document.getElementById('player-image')
    let playerInfoSection = document.getElementById('player-info')
    let betSummarySection = document.getElementById('bet-occurrence')
    
    // Add player image
    let imageTag = document.createElement('img')

    // LOOP - populate the player info section
    const playerInfoArray = ['player_name', 'player_position', 'player_team_name']
    for (key in playerInfoArray) {
      let val = playerInfoArray[key]
      playerInfoElement = playerInfoData[val]

      let pTag;
      if (key == 0) {
        pTag = document.getElementById('name')
      }
      else if (key == 1) {
        pTag = document.getElementById('pos')
      }
      else {
        pTag = document.getElementById('team')
      }
      pTag.append(playerInfoElement)
    }

    // Find bet summary sections by id
    let betOccurSum = document.getElementById('total-sum')
    let betLocSum = document.getElementById('loc-sum')
    let betMiscSum = document.getElementById('misc-sum')

    // Update the bet summary section headers
    const betSumSpans = document.querySelectorAll(".bet-summary-span")
    betSumSpans[0].innerHTML = `<h3>${operatorText} ${amount} ${statObj[statType]['avgColObj'][stat]}</h3>`
    betSumSpans[1].innerHTML = `<h3>${operatorText} ${amount} ${statObj[statType]['avgColObj'][stat]} (${capitalizedWord})</h3>`

    // LOOP - Populate the bet summary by year and by location sections
    periodArray = ['current', 'prior', 'third']
    for (element of periodArray) {
      // Initialize variables
      const year = yearArray[element]
      let totalHits = betOccurrenceData['player_total_hits'][year]
      if (totalHits == null) {
        totalHits = 0
      }

      // pupulate total section
      const betSummaryText = `<div class="test"><span class="white-span"><strong>${year}:</strong></span> <p>${betOccurrenceData[element]}% (${totalHits} of ${betOccurrenceData['player_total_games'][year]})</p></div>`
      let betSummaryElement = document.createElement('p')
      betSummaryElement.innerHTML = betSummaryText
      betOccurSum.appendChild(betSummaryElement)

      let totalLocHits = betOccurrenceData[`player_hits_location`][yearArray[element]]
      if (totalLocHits == null) {
        totalLocHits = 0
      }

      let totalLoc = betOccurrenceData[`loc_${element}`]
      if (totalLoc == null) {
            totalLoc = '0%'
        }

      // populate loc section
      const betSummaryLocText = `<div class="test"><span class="white-span"><strong>${year}:</strong></span> <p>${totalLoc}% (${totalLocHits} of ${betOccurrenceData['player_total_loc_games'][yearArray[element]]})</p></div>`
      let betLocSummaryElement = document.createElement('p')
      betLocSummaryElement.innerHTML = betSummaryLocText
      betLocSum.appendChild(betLocSummaryElement)
    }
   
    // LOOP - Populate the Bet-Summary-Misc div
    miscSummaryArray = ['vs_opponent', 'current_avg_limit', 'qb_player_data']
    for (const element of miscSummaryArray) {
      let betMiscElement = document.createElement('p')
      let miscElementText;
      if (element == 'vs_opponent') {
        miscElementText = `<div class="test"><span class="white-span"><strong>Vs Opponent:</strong></span> <p>${betOccurrenceData['vs_opponent']}% (${betOccurrenceData['vs_opponent_hits']} of ${betOccurrenceData['vs_opponent_games']})</p></div>`
      }
      else if (element == 'current_avg_limit') {
        let limitStatAvgText;
        const limitStatAvg = betOccurrenceData['current_avg_limit'].toFixed(2)
        if (passArray.includes(stat)) {
          miscElementText = `<div class="test"><span class="white-span"><strong>Avg Pass Att:</strong></span> <p>${limitStatAvg}</p></div>`
        }
        else if (rushArray.includes(stat)) {
          miscElementText = `<div class="test"><span class="white-span"><strong>Avg Rush Att:</strong></span> <p>${limitStatAvg}</p></div>`
        }
        else {
          miscElementText = `<div class="test"><span class="white-span"><strong>Avg Tgts:</strong></span> <p>${limitStatAvg}</p></div>`
        }  
      }
      else {
        if (playerInfoData['player_position'] == 'WR') {
          miscElementText = `<div class="test"><span class="white-span"><strong>With QB:</strong></span> <p>${betOccurrenceData['qb_player_data']}% (${betOccurrenceData['start_qb_hits']} of ${betOccurrenceData['start_qb_games']})</p></div>`
      }
      else {
        miscElementText = `<div class="test"><span class="white-span"><strong>TBD: </strong></span> <p>{TBD)</p></div>`
      }
    }
    betMiscElement.innerHTML = miscElementText
       
    betMiscSum.appendChild(betMiscElement)
  }
    
  //=========================================TEAM SECTION===============================================// 
    playerStatContainer = document.getElementById('player-summary')
    teamSumContainer = document.getElementById('team-sum')
    oppSumContainer = document.getElementById('opp-sum')

    // Update team / opponent names in span element
    spans = document.querySelectorAll('span')
    if (recArray.includes(stat)) {
        teamSpan = spans[16]
        teamSpan.innerHTML = `<h3>${team} Summary</h3>`
        oppSpan = spans[17]
        oppSpan.innerHTML = `<h3>${'BUF'} Summary</h3>`
    }
    else if (passArray.includes(stat)) {
        teamSpan = spans[15]
        teamSpan.innerHTML = `<h3>${team} Summary</h3>`
        oppSpan = spans[16]
        oppSpan.innerHTML = `<h3>${'BUF'} Summary</h3>`
    }
    
    // Populate team and opponent summary sections
    for (element in loopCols) {
      const statTotal = teamSummaryData[`team_${loopCols[element]}`]
      const statText = teamStatConv[loopCols[element]]
      const statRank = teamRankSummaryData[`${loopCols[element]}_rank`]

      const teamStatElement = document.createElement('p')
      teamStatElement.innerHTML = `<div class="test"><span class="white-span"><strong>${statText}:</strong></span> <p>${statTotal}  (<i>${statRank}th</i>)</p>`
      teamSumContainer.append(teamStatElement)

      const statTotalOpp = oppSummaryData[`team_${loopCols[element]}`]
      const statTextOpp = teamStatConv[loopCols[element]]
      const statRankOpp = oppRankSummaryData[`${loopCols[element]}_rank`]
      
      const oppStatElement = document.createElement('p')
      oppStatElement.innerHTML = `<div class="test"><span class="white-span"><strong>${statTextOpp}:</strong></span> <p>${statTotalOpp}  (<i>${statRankOpp}th</i>)</p>`
      oppSumContainer.append(oppStatElement)
    }

    // Populate player stat summary section
    playerAvgArray = [playerAvgData['player_avg_stats'], playerAvgData['player_home_avg'], playerAvgData['player_away_avgs']]
    for (lst in playerAvgArray) {
      loopArray = playerAvgArray[lst]

      // set textSeg variable
      let textSeg;
      if (lst == 0) {
        textSeg = 'avg'
      }
      else if (lst == 1) {
        textSeg = 'home'
      }
      else {
        textSeg = 'away'
      }

      for (const col in avgCols) {
        let playerPTag = document.createElement('p')
        const plyrElementText = `<div class="test"><span class="white-span"><strong>${avgColConv[avgCols[col]]}:</strong></span> <p>${loopArray[`${textSeg}_${avgCols[col]}`]}</p></div>`
        playerPTag.innerHTML = plyrElementText

        if (lst == 0) {
          sumSection = document.getElementById('sum-avg')
          sumSection.appendChild(playerPTag)
          }
        else if (lst == 1) {
          sumSection = document.getElementById('sum-home')
          sumSection.append(playerPTag)
          } 
        else {
          sumSection = document.getElementById('sum-away')
          sumSection.append(playerPTag)
        }
      }
    }

    // Populate table headers and colgroup
    logTable = document.getElementById('summary-logs')

    colGroup = document.createElement('colgroup')
    logTable.appendChild(colGroup)


    for (let i = 0; i < 11; i++) {
      column = document.createElement('col')
      colGroup.appendChild(column)
      }
    
    // Create and populate thead element
    let theadSum = document.createElement('thead')
    logTable.appendChild(theadSum)

    let tHeadRow = document.createElement('tr')
    theadSum.appendChild(tHeadRow)
  
    for (let i = 0; i < 11; i++) {
      th = document.createElement('th')
      th.innerText = statObj[statType]['sumLogHeader'][i]
      th.setAttribute("scope", "col")
      th.setAttribute("data-stat", statObj[statType]['statDataAtt'][i])
      tHeadRow.appendChild(th)
      }
    
    // Create table body element and populate table with rows and data
    tableBody = document.createElement('tbody')
    logTable.appendChild(tableBody)
      
    // LOOP - loop thorugh tahle data and populate rows
    for  (let i = 1; i <= Object.keys(logSummaryData).length; i++) {
      const loopObj = logSummaryData[i]

      const tableRow = document.createElement('tr')
      const rowHeader = document.createElement('th')

      rowHeader.innerText = loopObj['game_id']
      tableRow.append(rowHeader)


      for (let i = 1; i < Object.keys(loopObj).length - 2; i++) {
        let statVal = loopObj[statObj[statType]['statDataAtt'][i]]

        if ((i == 4) || (i == 5)) {
          statVal = nflTeamArray[statVal]
        }

        const rowData = document.createElement('td')
        rowData.setAttribute("data-stat", statObj[statType]['statDataAtt'][i])

        rowData.classList.add('center')
        rowData.innerText = statVal
        tableRow.append(rowData)
      }

      tableBody.appendChild(tableRow)
    }
  }

summarySection(nflIdArray[team])
 

</script>
