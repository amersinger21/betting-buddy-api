<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./results.css" />
  </head>
  <body>
    <h1>Betting Buddy Results Page</h1>
    <div id="summary">
      <div id="first-row">
        <div id="player-image" class="first-level"></div>
        <div id="player-info" class="first-level">
          <p id="name"><strong>Name: </strong></p>
          <p id="pos"><strong>Pos: </strong></p>
          <p id="team"><strong>Team: </strong></p>
        </div>
        <div id="bet-summary-occur" class="first-level">
          <div id="total-sum" class="bet-summary"><span><strong>Bet Summary</strong></span></div>
          <div id="loc-sum" class="bet-summary"><span><strong>Location Summary</strong></span></div>
          <div id="misc-sum" class="bet-summary"><span><strong>Misc Summary</strong></span></div>
        </div>
      </div>
      <div id="second-row">
          <div class="second">
            <span><strong>Player Summary</strong></span>
            <div id="player-sum-container">
            <div id="sum-avg" class="player-stat-sum"><span><strong>Total</strong></span></div>
            <div id="sum-home" class="player-stat-sum"><span><strong>Home</strong></span></div>
            <div id="sum-away" class="player-stat-sum"><span><strong>Away</strong></span></div>
            </div>
          </div>
          <div id="team-sum" class="second"><span><strong>Team Summary</strong></span></div>
          <div id="opp-sum" class="second"><span><strong>Opponent Summary</strong></span></div>
      </div>
    </div>
  </body>
</html>

<script>

  nfl_teams = {'ARI': 1, 'ATL': 2, 'BAL': 3, 'BUF': 4, 'CAR': 5, 'CHI': 6, 'CIN': 7, 'CLE': 8, 'DAL': 9, 'DEN': 10,
                 'DET': 11, 'GB': 12, 'HOU': 13, 'IND': 14, 'JAX': 15, 'KC': 16, 'LAC': 17, 'LAR': 18, 'LV': 19,
                 'MIA': 20, 'MIN': 21, 'NE': 22, 'NO': 23, 'NYG': 24, 'NYJ': 25, 'PHI': 26, 'PIT': 27, 'SEA': 28,
                 'SF': 29, 'TB': 30, 'TEN': 31, 'WAS': 32}
  passArray = ['pass_att', 'pass_yards', 'pass_td', 'pass_comp', 'pass_longest']
  rushArray = ['rush_att', 'rush_yards', 'rush_td', 'rush_longest']
  recArray = ['rec', 'targets', 'rec_yards', 'rec_td', 'rec_longest']
  
  statDict = {
    'pass_att': 'Pass Att', 'pass_yards': 'Pass Yard', 'pass_td': 'Pass TD', 'pass_comp': 'Pass Completions', 'pass_longest': 'Longest Pass', 
    'rush_att': 'Rush Att','rush_yards': 'Rush Yard', 'rush_td': 'Rush TD', 'rush_longest': 'Longest Rush',
    'rec': 'Receptions', 'targets': 'Targets', 'rec_yards': 'Rec Yard', 'rec_td': 'Rec TD', 'rec_longest': 'Longest Catch'}

  statLimitDict = {
    'pass_att': 'Pass Att', 'pass_yards': 'Pass Att', 'pass_td': 'Pass Att', 'pass_comp': 'Pass Att', 'pass_longest': 'Pass Att', 
    'rush_att': 'Rush Att','rush_yards': 'Rush Att', 'rush_td': 'Rush Att', 'rush_longest': 'Rush Att',
    'rec': 'Targets', 'targets': 'Targets', 'rec_yards': 'Targets', 'rec_td': 'Targets', 'rec_longest': 'Targets'}

  yearArray = {
    'current': 2025,
    'prior': 2024,
    'third': 2023,
    'fourth': 2022,
    'fifth': 2021
  }
  let params = new URLSearchParams(document.location.search);

  const id = params.get("id");
  const stat = params.get("stat");
  const team = params.get('team')
  const operator = params.get("operator");
  const amount = params.get("amount");
  const limitStat = statLimitDict[stat]
  console.log(limitStat)
  let data;


  console.log(id)
  console.log(stat)
  console.log(team)
  console.log(operator)
  console.log(amount)

  // What is this referencing? Are they just not built yet?
  const statName = document.querySelector("#statName");
  const statResult = document.querySelector("#statResult");

  // console.log(nfl_teams[team])
  async function summarySection(team_id) {
    //=========================================PLAYER SECTION===============================================// 
    
    const playerInfoResponse = await fetch(`http://129.80.84.210/api/nfl/summary/player_info?id=${id}`);
    const playerInfoData = await playerInfoResponse.json();
 
    const startQbRequest = await fetch(`http://129.80.84.210/api/nfl/team/starting_qb?team_id=${team_id}`);
    const startQbData = await startQbRequest.json();
    const startingQB = startQbData['starting_qb']

    const nextGameRequest = await fetch(`http://129.80.84.210/api/nfl/player/next_game?team_id=${team_id}`);
    const nextGameData = await nextGameRequest.json();
    const location = nextGameData['next_game_loc']

    const betSummaryRequest = await fetch(
      `http://129.80.84.210/api/nfl/summary/bet_occurrence_summary?id=${id}&stat=${stat}&operator=${operator}&value=${amount}&opp_id=4&loc=${location}&qb=${startingQB}`);
    const betOccurrenceData = await betSummaryRequest.json();

    const playerAvgRequest = await fetch(
      `http://129.80.84.210/api/nfl/summary/player_summary?id=${id}&stat=${stat}&opp_id=4`);
    const playerAvgData = await playerAvgRequest.json();
    console.log(playerAvgData)

    //=========================================TEAM SECTION===============================================// 
    const teamSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/team_summary?team_id=${nfl_teams[team]}&stat=${stat}`);
    const teamSummaryData = await teamSummaryRequest.json();

    const teamRankSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/team_rank_summary?team_id=${nfl_teams[team]}&stat=${stat}`);
    const teamRankSummaryData = await teamRankSummaryRequest.json();

    const oppSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/opponent_summary?opp_id=4&stat=${stat}`);
    const oppSummaryData = await oppSummaryRequest.json();

    const oppRankSummaryRequest = await fetch(`http://129.80.84.210/api/nfl/summary/opponent_rank_summary?opp_id=4&stat=${stat}`);
    const oppRankSummaryData = await oppRankSummaryRequest.json();

    // Initialize function variables
    let loopCols;
    if (stat in ['rush_att', 'rush_yards', 'rush_td', 'rush_longest']) {
        loopCols = ['rush_att', 'rush_yards', 'rush_td', 'rush_yards_per_att', 'rush_yards_per_game']
        rankCols = ['rush_att_rank', 'rush_yards_rank', 'rush_td_rank', 'yards_per_att_rank', 'yards_per_game_rank']
        teamStatConv = {'rush_att': 'Rush Att', 
                        'rush_yards': 'Rush Yards', 
                        'rush_td': 'Rush TD',
                        'yards_per_att': 'Yards Per Att', 
                        'yards_per_game': 'Yards per Game'}
        avgCols = ['rush_att', 'rush_yards', 'rush_td', 'rush_longest']
        avgColConv = {'rush_att': 'Rush Att', 
                      'rush_yards': 'Rush Yds', 
                      'rush_td': 'Rec TD',
                      'rush_longest': 'Longest Rec'}}
    else {
        loopCols = ['pass_att', 'pass_comp', 'pass_yards', 'pass_td', 'pass_yards_per_att', 'pass_yards_per_game']
        rankCols = ['pass_att_rank', 'pass_comp_rank', 'pass_yards_rank', 'pass_td_rank', 'yards_per_att_rank', 'pass_yards_per_game_rank']
        if (playerInfoData['player_position'] == 'WR') {
          avgCols = ['rec', 'targets', 'rec_yards', 'rec_td', 'rec_longest']
          avgColConv = {'rec': 'Rec', 
                        'targets': 'Tgts', 
                        'rec_yards': 'Rec Yds',
                        'rec_td': 'Rec TD',
                        'rec_longest': 'Longest Rec'}
          teamStatConv = {'pass_att': 'Targets', 
                          'pass_comp': 'Rec', 
                          'pass_yards': 'Rec Yards',
                          'pass_td': 'Rec TD',
                          'pass_yards_per_att': 'Yards Per Rec', 
                          'pass_yards_per_game': 'Rec Yds per Game'}
        }
        else {
          avg_cols = ['pass_att', 'pass_comp', 'pass_yards', 'pass_td', 'pass_longest']
          avgColConv = {'pass_att': 'Pass Att', 
                        'pass_comp': 'Completions', 
                        'pass_yards': 'Pass Yds',
                        'pass_td': 'Pass TD',
                        'pass_longest': 'Longest Pass'}
          teamStatConv = {'pass_att': 'Pass Att', 
                          'pass_comp': 'Pass Comp', 
                          'pass_yards': 'Pass Yards',
                          'pass_td': 'Pass TD',
                          'pass_yards_per_att': 'Yards Per Att', 
                          'pass_yards_per_game': 'Yards per Game'}
        }
    }


     //=========================================PLAYER SECTION===============================================// 
    // Capitalize location variable
    const firstLetter = location.charAt(0)
    const firstLetterCap = firstLetter.toUpperCase()
    const remainingLetters = location.slice(1)
    const capitalizedWord = firstLetterCap + remainingLetters

    // locate the summary section and populate with summay data
    let summaryTag = document.getElementById('summary')
    let firstRow = document.getElementById('first-row')
    let playerImageSection = document.getElementById('player-image')
    let playerInfoSection = document.getElementById('player-info')
    let betSummarySection = document.getElementById('bet-occurrence')
    
    // Add player image
    let imageTag = document.createElement('img')

    const playerInfoArray = ['player_name', 'player_position', 'player_team_name']
    for (key in playerInfoArray) {
      let val = playerInfoArray[key]
      playerInfoElement = playerInfoData[val]

      let pTag;
      if (key == 0) {
        pTag = document.getElementById('name')
      }
      else if (key == 1) {
        pTag = document.getElementById('pos')
      }
      else {
        pTag = document.getElementById('team')
      }
      pTag.append(playerInfoElement)
    }

    // Find bet summary sections by id
    let betOccurSum = document.getElementById('total-sum')
    let betLocSum = document.getElementById('loc-sum')
    let betMiscSum = document.getElementById('misc-sum')

    // Populate the bet summary by year and by location sections
    periodArray = ['current', 'prior', 'third']
    let miscElementText;
    for (element of periodArray) {
      // Initialize variables
      const year = yearArray[element]

      // pupulate total section
      const betSummaryText = `${year}: ${betOccurrenceData[element]}% (${betOccurrenceData['player_total_hits'][year]} of ${betOccurrenceData['player_total_games'][year]})`
      let betSummaryElement = document.createElement('p')
      betSummaryElement.innerText = betSummaryText
      betOccurSum.appendChild(betSummaryElement)

      // populate loc section
      const betSummaryLocText = `${year}: ${betOccurrenceData[`loc_${element}`]}% (${betOccurrenceData[`player_hits_location`][yearArray[element]]} of ${betOccurrenceData['player_total_loc_games'][yearArray[element]]})`
      let betLocSummaryElement = document.createElement('p')
      betLocSummaryElement.innerText = betSummaryLocText
      betLocSum.appendChild(betLocSummaryElement)
    }
   
    // Populate the Bet-Summary-Misc div
    miscSummaryArray = ['vs_opponent', 'current_avg_limit', 'qb_player_data']
    for (const element of miscSummaryArray) {
      let betMiscElement = document.createElement('p')
      let miscElementText;
      if (element == 'vs_opponent') {
        miscElementText = `Vs Opponent: ${betOccurrenceData['vs_opponent']}% (${betOccurrenceData['vs_opponent_hits']} of ${betOccurrenceData['vs_opponent_games']})`
      }
      else if (element == 'current_avg_limit') {
        let limitStatAvgText;
        const limitStatAvg = betOccurrenceData['current_avg_limit'].toFixed(2)
        if (passArray.includes(stat)) {
          miscElementText = `Avg Pass Att: ${limitStatAvg}`
        }
        else if (rushArray.includes(stat)) {
          miscElementText = `Avg Rush Att ${limitStatAvg}`
        }
        else {
          miscElementText = `Avg Tgts: ${limitStatAvg}`
        }  
      }
      else {
        if (playerInfoData['player_position'] == 'WR') {
          miscElementText = `With QB: ${betOccurrenceData['qb_player_data']}% (${betOccurrenceData['start_qb_hits']} of ${betOccurrenceData['start_qb_games']})`
      }
    }
    betMiscElement.innerText = miscElementText
       
    betMiscSum.appendChild(betMiscElement)
  }
    
  //=========================================TEAM SECTION===============================================// 
    playerStatContainer = document.getElementById('player-summary')
    teamSumContainer = document.getElementById('team-sum')
    oppSumContainer = document.getElementById('opp-sum')

    // Populate team and opponent summary sections
    for (element in loopCols) {
      const statTotal = teamSummaryData[`team_${loopCols[element]}`]
      const statText = teamStatConv[loopCols[element]]
      const statRank = teamRankSummaryData[`${loopCols[element]}_rank`]

      const teamStatElement = document.createElement('p')
      teamStatElement.innerText = `${statText}: ${statTotal}  (${statRank}th)`
      teamSumContainer.append(teamStatElement)

      const statTotalOpp = oppSummaryData[`team_${loopCols[element]}`]
      const statTextOpp = teamStatConv[loopCols[element]]
      const statRankOpp = oppRankSummaryData[`${loopCols[element]}_rank`]

      const oppStatElement = document.createElement('p')
      oppStatElement.innerText = `${statTextOpp}: ${statTotalOpp}  (${statRankOpp}th)`
      oppSumContainer.append(oppStatElement)
    }

    // Populate player stat summary section
    playerAvgArray = [playerAvgData['player_avg_stats'], playerAvgData['player_home_avg'], playerAvgData['player_away_avgs']]
    for (lst in playerAvgArray) {
      loopArray = playerAvgArray[lst]
      console.log(lst)

      // set textSeg variable
      let textSeg;
      if (lst == 0) {
        textSeg = 'avg'
      }
      else if (lst == 1) {
        textSeg = 'home'
      }
      else {
        textSeg = 'away'
      }
      
      for (const col in avgCols) {
        let playerPTag = document.createElement('p')
        const plyrElementText = `${avgColConv[avgCols[col]]}: ${loopArray[`${textSeg}_${avgCols[col]}`]}`
        playerPTag.innerText = plyrElementText

        if (lst == 0) {
          sumSection = document.getElementById('sum-avg')
          sumSection.appendChild(playerPTag)
          }
        else if (lst == 1) {
          sumSection = document.getElementById('sum-home')
          sumSection.append(playerPTag)
          } 
        else {
          sumSection = document.getElementById('sum-away')
          sumSection.append(playerPTag)
        }
      }
    }
  }

  summarySection(nfl_teams[team])
</script>
