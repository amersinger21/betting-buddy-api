<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Betting Buddy - Football</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/light.css"
		/>
		<link rel="stylesheet" href="/client/global.css" />
		<script
			type="module"
			src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace-autoloader.js"
		></script>
	</head>
	<body>
		<nav>
			<h1 id="logo">The Betting Buddy</h1>
			<sl-icon-button
				name="list"
				style="font-size: 2.5rem"
				label="menu"
				id="menu-open"
			>
			</sl-icon-button>
		</nav>
		<sl-drawer label="Drawer" placement="end" class="drawer-placement-end">
			<a href="/client/pages/football.html">
				<button class="btn-sport">
					<img
						class="icon"
						src="/client/images/rugby-ball.png"
						alt="football icon"
					/>
					<p>Football</p>
				</button>
			</a>
			<a href="/client/error.html">
				<button class="btn-sport">
					<img
						class="icon"
						src="/client/images/basketball-ball.png"
						alt="football icon"
					/>
					<p>Basketball</p>
				</button>
			</a>
			<a href="/client/football.html">
				<button class="btn-sport">
					<img
						class="icon"
						src="/client/images/baseball.png"
						alt="football icon"
					/>
					<p>Baseball</p>
				</button>
			</a>
			<a href="/client/football.html">
				<button class="btn-sport">
					<img
						class="icon"
						src="/client/images/hockey.png"
						alt="football icon"
					/>
					<p>Hockey</p>
				</button>
			</a>
			<a href="/">
				<button class="btn-sport disabled">
					<img
						class="icon"
						src="/client/images/soccer-ball.png"
						alt="football icon"
					/>
					<p>Soccer</p>
				</button>
			</a>
		</sl-drawer>
		<main>
			<h3>Select a search type</h3>
			<div class="form-container">
				<sl-radio-group value="player" id="search-selector">
					<sl-radio-button
						value="player"
						size="medium"
						variant="primary"
						>Player</sl-radio-button
					>
					<sl-radio-button
						value="team"
						size="medium"
						variant="success"
						>Team</sl-radio-button
					>
				</sl-radio-group>
				<form id="search-player" class="search-form hidden">
					<sl-select placeholder="Player Name"></sl-select>
					<sl-select placeholder="Stat"></sl-select>
					<sl-select placeholder="Over/Under">
						<sl-option value="over">Over</sl-option>
						<sl-option value="under">Under</sl-option>
					</sl-select>
					<sl-input
						type="number"
						placeholder="Amount"
						clearable
					></sl-input>
					<a href="/client/pages/football/results.html">
						<sl-button type="button" variant="success"
							>Search
						</sl-button>
					</a>
				</form>
				<form id="search-team" class="search-form">
					<sl-select placeholder="Team Name"></sl-select>
					<sl-select placeholder="Stat"></sl-select>
					<sl-select placeholder="Over/Under">
						<sl-option value="over">Over</sl-option>
						<sl-option value="under">Under</sl-option>
					</sl-select>
					<sl-input
						type="number"
						placeholder="Amount"
						clearable
					></sl-input>
					<a href="/client/pages/football/results.html">
						<sl-button type="button" variant="success"
							>Search
						</sl-button>
					</a>
				</form>
			</div>
		</main>
	</body>
</html>

<script>
	//drawer control
	const drawer = document.querySelector(".drawer-placement-end");
	const openButton = document.querySelector("#menu-open");
	const closeButton = drawer.querySelector('sl-button[variant="primary"]');

	openButton.addEventListener("click", () => drawer.show());

	//form swap control
	const playerSearch = document.querySelector("#search-player");
	const teamSearch = document.querySelector("#search-team");
	const searchType = document.querySelector("#search-selector");

	searchType.addEventListener("click", () => {
		let x = searchType.getAttribute("value");
		let displayPlayer = getComputedStyle(playerSearch).display;
		let displayTeam = getComputedStyle(teamSearch).display;

		if (x == "player") {
			playerSearch.classList.add("active");
			playerSearch.classList.remove("hidden");
			teamSearch.classList.add("hidden");
			teamSearch.classList.remove("active");
		} else if (x == "team") {
			playerSearch.classList.add("hidden");
			playerSearch.classList.remove("active");
			teamSearch.classList.add("active");
			teamSearch.classList.remove("hidden");
		}
	});
</script>

<script type="module">
	await Promise.allSettled([
		customElements.whenDefined("sl-drawer"),
		customElements.whenDefined("sl-radio-group"),
		customElements.whenDefined("sl-input"),
		customElements.whenDefined("sl-select"),
	]);

	document.body.classList.add("ready");
</script>

<style>
	body {
		opacity: 0;
	}

	body.ready {
		opacity: 1;
		transition: 0.25s opacity;
	}
</style>
