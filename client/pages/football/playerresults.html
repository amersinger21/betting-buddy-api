<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>The Betting Buddy - Home</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/light.css"
		/>
		<link rel="stylesheet" href="/client/global.css" />
		<script
			type="module"
			src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace-autoloader.js";

		></script>
	</head>
	<body>
		<nav>
			<a href="/client/index.html"
				><h1 id="logo">The Betting Buddy</h1></a
			>
			<sl-icon-button
				name="list"
				style="font-size: 2.5rem"
				label="menu"
				id="menu-open"
			>
			</sl-icon-button>
		</nav>
		<main>
			<a href="/client/pages/football/search.html">
				<sl-button type="button" variant="success">
					Back to search
				</sl-button>
			</a>
			<br>
			<div id="summaryBox" class="infoBox">
				<img
					src="/client/images/placeholder-headshot.jpg"
					alt="headshot of searched player"
				></img>
				<h2 id="playerName"></h2>
				<div class="flex dataPair">
					<h3>Searched Bet:</h3><p id="searchedBet"></p>
				</div>
				<div id="betSummary">
					<div class="flex column statLabel">
						<div class="dataPair flex">
							<p id="currentYearOccurance">Bet Occurance (Current): </p>
							<p id="currentYearOccuranceData" class="bold"></p>
						</div>
						<div class="dataPair flex">
							<p id="priorYearOccurance">Occurance (Prior):</p>
							<p id="priorYearOccuranceData" class="bold"></p>
						</div>
					<div class=" flex dataPair">
						<p id="priorTwoYearOccurance">Bet Occurance (2 Prior): </p>
						<p id="priorTwoYearOccuranceData" class="bold"></p>
					</div>
				</div>
					
					<div class="flex column statLabel">
					<p id="currentYearPercent">Bet % (Current): </p>
					<p id="priorYearPercent">Bet % (Prior):</p>
					<p id="priorTwoYearPercent">Bet % (2 Prior): </p>	
					</div>
					
				</div>
				<sl-button type="button" varient=""></sl-button>
			</div>
			<br>
			<div id="teamInfoBox" class="infoBox">

				</div>
			</div>
			<br>
			<div id="nextMatchupBox" class="infoBox">
					<p id="statName"></p>
					<p id="statResult">###</p>
				</div>
			</div>
		</main>
		<sl-drawer label="Drawer" placement="end" class="drawer-placement-end">
			This drawer slides in from the start.
			<sl-button slot="footer" variant="primary">Close</sl-button>
		</sl-drawer>
	</body>
</html>
<script>
	let params = new URLSearchParams(document.location.search);
	const id = params.get("id");
	const stat = params.get("stat");
	const operator = params.get("operator");
	const value = params.get("value");
	
	//summary box elements
	const betOccuranceCurrent = document.getElementById("currentYearOccuranceData");
	const betOccurancePrior = document.getElementById("priorYearOccuranceData");
	const betOccuranceTwoPrior = document.getElementById("priorTwoYearOccuranceData");
	const searchedBet = document.getElementById("searchedBet");
	const playerName = document.getElementById("playerName");

	//request data
	async function playerResults(sportID) {
		const response = await fetch(
			`http://129.80.84.210/api/nfl/player_logs?id=${sportID}&stat=${stat}&operator=${operator}&value=${value}`
		);
		
		const data = await response.json();
		console.log(data);

		playerName.innerText = "PLAYER NAME";
		searchedBet.innerText = stat + " " + operator +" "+ value ;
		betOccuranceCurrent.innerText = data.bet_occurrences_current;
		betOccurancePrior.innerText = data.bet_occurrences_prior;
		betOccuranceTwoPrior.innerText = data.bet_occurrences_third;


	}

	playerResults(id);


	//drawer controls
	const drawer = document.querySelector(".drawer-placement-end");
	const openButton = document.querySelector("#menu-open");
	const closeButton = drawer.querySelector('sl-button[variant="primary"]');

	openButton.addEventListener("click", () => drawer.show());
	closeButton.addEventListener("click", () => drawer.hide());
</script>
